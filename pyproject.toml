[project]
name = "testwise"
version = "0.1.0"
description = "TestWise 智能接口测试框架：基于 Pytest 的 YAML 数据驱动接口自动化测试框架，集成 AI 结果分析与并行执行能力"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "allure-pytest>=2.13.5",
    "jsonpath>=0.82.2",
    "pandas>=2.2.3",
    "paramiko",
    "pymongo",
    "pymysql",
    "pytest>=8.3.2",
    "pytest-cov>=5.0",
    "pytest-rerunfailures>=14.0",
    "pytest-xdist>=3.6",
    "pyyaml>=6.0.2",
    "redis>=5.2.1",
    "requests>=2.32.3",
    "ruff>=0.6",
    "sqlalchemy>=2.0.36",
    "xlrd>=2.0.1",
    "xlutils>=2.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = [".venv", "report", "mock_server/api_server/.venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# mock server 为遗留代码，保留历史实现，仅豁免未使用变量告警
"mock_server/**" = ["F841"]

[tool.ruff.format]
quote-style = "double"

[tool.coverage.run]
data_file = "report/coverage/.coverage"
